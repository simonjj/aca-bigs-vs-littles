name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22.20.0
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix app

      - name: Test simulation app
        run: npm test --prefix app

      - name: Validate JavaScript syntax
        run: |
          node --check app/server.js
          node --check app/ecosystem.config.cjs

      - name: Validate JMeter XML
        run: python -c "import xml.etree.ElementTree as ET; ET.parse('load-tests/benchmark.jmx')"

      - name: Build single-process image
        run: docker build --build-arg PROCESS_MODEL=single -f app/Containerfile -t aca-lvb:single app

      - name: Build PM2 image
        run: docker build --build-arg PROCESS_MODEL=pm2 -f app/Containerfile -t aca-lvb:pm2 app

      - name: Build Bicep
        uses: azure/cli@v2
        with:
          inlineScript: az bicep build --file infra/main.bicep --stdout > /dev/null
